name: Update Radius

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0,12 * * *"

jobs:
  update-radius:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: true

      - name: Install Nix
        uses: cachix/install-nix-action@51f3067b56fe8ae331890c77d4e454f6d60615ff # v31.10.2

      - name: Configure Cachix
        uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        with:
          name: itpropro
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Check for updates
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/update-radius.sh --ci --only-check

      - name: Update Radius sources
        id: update
        if: steps.check.outputs.should_update == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/update-radius.sh --ci

      - name: Commit source updates
        if: steps.check.outputs.should_update == 'true'
        uses: stefanzweifel/git-auto-commit-action@04702edda442b2e678b25b537cec683a1493fcb9 # v7.1.0
        with:
          commit_message: ${{ steps.update.outputs.commit_message }}
          file_pattern: nix/sources.json README.md

      - name: Check updated sources
        if: steps.check.outputs.should_update == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run check.yml --ref main
