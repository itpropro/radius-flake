name: Check flake

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "**/*.nix"
      - "flake.lock"
      - "nix/sources.json"
      - ".github/workflows/*.yml"
      - ".github/update-radius.sh"
      - ".github/nix-artifacts.sh"
      - ".github/tests/test_nix_artifacts.py"
  pull_request:
    paths:
      - "**/*.nix"
      - "flake.lock"
      - "nix/sources.json"
      - ".github/workflows/*.yml"
      - ".github/update-radius.sh"
      - ".github/nix-artifacts.sh"
      - ".github/tests/test_nix_artifacts.py"

permissions:
  contents: read
  actions: read

concurrency:
  group: flake-check-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      run-id: ${{ steps.artifacts.outputs.run-id }}
      artifact-suffix: ${{ steps.artifacts.outputs.artifact-suffix }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Test artifact selection
        run: python3 .github/tests/test_nix_artifacts.py

      - name: Find tested PR outputs
        id: artifacts
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/nix-artifacts.sh resolve

  check:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@51f3067b56fe8ae331890c77d4e454f6d60615ff # v31.10.2

      - name: Configure Cachix
        uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        with:
          name: itpropro
          skipPush: true

      - name: Check formatting
        run: nix run nixpkgs#alejandra -- --check .

      - name: Evaluate supported systems
        run: |
          nix eval .#packages.x86_64-linux.rad.meta.mainProgram >/dev/null
          nix eval '.#packages.aarch64-linux.rad.meta.mainProgram' >/dev/null
          nix eval '.#packages.aarch64-linux."rad-rc".meta.mainProgram' >/dev/null
          nix eval '.#packages.aarch64-darwin.rad.meta.mainProgram' >/dev/null
          nix eval '.#packages.aarch64-darwin."rad-rc".meta.mainProgram' >/dev/null
          nix eval '.#packages.aarch64-darwin.bicep.meta.mainProgram' >/dev/null

      - name: Download tested Nix outputs
        if: needs.prepare.outputs.run-id != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nix-x86_64-linux-${{ needs.prepare.outputs.artifact-suffix }}
          path: ${{ runner.temp }}/nix-artifact
          github-token: ${{ github.token }}
          run-id: ${{ needs.prepare.outputs.run-id }}

      - name: Import tested Nix outputs
        if: needs.prepare.outputs.run-id != ''
        run: bash .github/nix-artifacts.sh import

      - name: Run flake checks
        run: nix flake check

      - name: Export tested Nix outputs
        id: artifact
        if: github.event_name == 'pull_request'
        run: bash .github/nix-artifacts.sh export

      - name: Upload tested Nix outputs
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.artifact.outputs.artifact-name }}
          path: ${{ runner.temp }}/nix-artifact/store.nar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Publish outputs to Cachix
        if: github.event_name == 'push'
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          bash .github/nix-artifacts.sh roots | cachix push itpropro

  check-linux-arm64:
    needs: prepare
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@51f3067b56fe8ae331890c77d4e454f6d60615ff # v31.10.2

      - name: Configure Cachix
        uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        with:
          name: itpropro
          skipPush: true

      - name: Download tested Nix outputs
        if: needs.prepare.outputs.run-id != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nix-aarch64-linux-${{ needs.prepare.outputs.artifact-suffix }}
          path: ${{ runner.temp }}/nix-artifact
          github-token: ${{ github.token }}
          run-id: ${{ needs.prepare.outputs.run-id }}

      - name: Import tested Nix outputs
        if: needs.prepare.outputs.run-id != ''
        run: bash .github/nix-artifacts.sh import

      - name: Run flake checks
        run: nix flake check --print-build-logs

      - name: Export tested Nix outputs
        id: artifact
        if: github.event_name == 'pull_request'
        run: bash .github/nix-artifacts.sh export

      - name: Upload tested Nix outputs
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.artifact.outputs.artifact-name }}
          path: ${{ runner.temp }}/nix-artifact/store.nar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Publish outputs to Cachix
        if: github.event_name == 'push'
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          bash .github/nix-artifacts.sh roots | cachix push itpropro

  check-darwin:
    needs: prepare
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@51f3067b56fe8ae331890c77d4e454f6d60615ff # v31.10.2

      - name: Configure Cachix
        uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        with:
          name: itpropro
          skipPush: true

      - name: Download tested Nix outputs
        if: needs.prepare.outputs.run-id != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nix-aarch64-darwin-${{ needs.prepare.outputs.artifact-suffix }}
          path: ${{ runner.temp }}/nix-artifact
          github-token: ${{ github.token }}
          run-id: ${{ needs.prepare.outputs.run-id }}

      - name: Import tested Nix outputs
        if: needs.prepare.outputs.run-id != ''
        run: bash .github/nix-artifacts.sh import

      - name: Run flake checks
        run: nix flake check --print-build-logs

      - name: Run Bicep
        run: nix run .#bicep -- --version

      - name: Export tested Nix outputs
        id: artifact
        if: github.event_name == 'pull_request'
        run: bash .github/nix-artifacts.sh export

      - name: Upload tested Nix outputs
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.artifact.outputs.artifact-name }}
          path: ${{ runner.temp }}/nix-artifact/store.nar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Publish outputs to Cachix
        if: github.event_name == 'push'
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          bash .github/nix-artifacts.sh roots | cachix push itpropro

  release:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [check, check-linux-arm64, check-darwin]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: supported-radius-releases
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Publish supported Radius releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          stable_rev="$(jq -r '.stable.rev' nix/sources.json)"
          stable_commit="$(jq -r '.stable.commit' nix/sources.json)"
          rc_rev="$(jq -r '.rc.rev' nix/sources.json)"
          rc_commit="$(jq -r '.rc.commit' nix/sources.json)"

          if ! gh release view "$stable_rev" >/dev/null 2>&1; then
            gh release create "$stable_rev" \
              --target "$GITHUB_SHA" \
              --title "Radius $stable_rev (stable)" \
              --notes "Packages Radius $stable_rev ($stable_commit) as the stable rad package." \
              --latest
          fi

          if ! gh release view "$rc_rev" >/dev/null 2>&1; then
            gh release create "$rc_rev" \
              --target "$GITHUB_SHA" \
              --title "Radius $rc_rev (RC)" \
              --notes "Packages Radius $rc_rev ($rc_commit) as the rad-rc package." \
              --prerelease \
              --latest=false
          fi
